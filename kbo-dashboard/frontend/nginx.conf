server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: 정적 파일이 없으면 index.html 로 폴백(클라이언트 라우팅).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html 은 매번 재검증한다. 파일명에 해시가 안 붙는 유일한 파일이라
  # 이게 캐시되면 새로 배포해도 브라우저가 옛 번들을 계속 불러온다 —
  # 화면만 보고는 배포가 안 된 것처럼 보인다(하드 새로고침 전까지).
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # 반대로 /assets/ 는 내용이 바뀌면 파일명(해시)이 바뀐다. 영구 캐시가 안전하고,
  # 그래야 위의 no-cache 가 매 방문마다 번들을 다시 받게 만들지 않는다.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # 백엔드 API 프록시. 'backend' 는 docker-compose 서비스명(같은 네트워크 필요).
  # axios 가 상대경로 /api/... 로 호출하므로 prefix 를 그대로 backend 로 넘긴다.
  #
  # resolver(=Docker 내장 DNS) + 변수 proxy_pass 를 쓰면 backend 호스트명을
  # '기동 시'가 아니라 '요청 시'에 해석한다. 덕분에 backend 가 잠시 죽어 있어도
  # nginx(정적 사이트)는 정상 기동하고, backend 재시작에 따른 IP 변경도 따라간다.
  location /api/ {
    resolver 127.0.0.11 valid=30s;
    set $kbo_backend http://backend:8001;
    proxy_pass $kbo_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
