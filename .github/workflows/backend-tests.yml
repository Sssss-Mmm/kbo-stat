# main 대상 PR 과 main push 에서 백엔드 회귀 테스트를 돌린다.
# 테스트는 DB·OpenAI·네이버를 모두 mock 하므로 Secrets 나 PostgreSQL 이 필요 없다.
name: 백엔드 테스트

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: kbo-dashboard/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: kbo-dashboard/backend/requirements.txt

      - run: pip install -r requirements.txt

      - run: python -m unittest discover -s tests -v
