# main 대상 PR 과 main push 에서 프론트엔드 단위 테스트·lint·build 를 돌린다.
# 필수 체크로 지정할 수 있게 paths 필터를 두지 않는다(필터가 있으면 해당 경로를 안 건드린 PR 에 체크가 생기지 않아 병합이 막힌다).
# 백엔드 CI(backend-tests.yml)와 독립 — API·DB 없이 순수 함수 테스트와 정적 빌드만 한다.
name: 프론트엔드 테스트

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: kbo-dashboard/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: kbo-dashboard/frontend/package-lock.json

      - run: npm ci

      - name: 단위 테스트
        run: npm test

      # 경고도 실패로 — 지금 경고 0건을 유지한다
      - name: lint
        run: npm run lint -- --max-warnings=0

      - name: build
        run: npm run build
